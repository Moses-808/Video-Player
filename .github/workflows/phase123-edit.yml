name: Phase 1-3 playback edit
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply controlled playback changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/innotrepid/videoplayer/playback/PlaybackController.kt')
          s = p.read_text()
          s = s.replace('data class Error(val positionMs: Long, val message: String) : Event\n', 'data class Error(val positionMs: Long, val message: String) : Event\n        data class Released(val mediaUri: Uri, val positionMs: Long, val durationMs: Long) : Event\n')
          s = s.replace('    private var canRetry = false\n', '    private var canRetry = false\n    private var activeMediaUri: Uri? = null\n')
          s = s.replace('''        mutableState.value = PlaybackUiState()\n        player.setMediaItem(\n            androidx.media3.common.MediaItem.fromUri(uri),\n            startPositionMs.coerceAtLeast(0L)\n        )\n''', '''        mutableState.value = PlaybackUiState()\n        activeMediaUri = uri\n        player.stop()\n        player.clearMediaItems()\n        player.setMediaItem(\n            androidx.media3.common.MediaItem.fromUri(uri),\n            startPositionMs.coerceAtLeast(0L)\n        )\n''')
          s = s.replace('''        player.clearMediaItems()\n        switchingMedia = false\n        mutableState.value = PlaybackUiState()\n''', '''        player.clearMediaItems()\n        activeMediaUri = null\n        switchingMedia = false\n        mutableState.value = PlaybackUiState()\n''')
          s = s.replace('''    fun release() {\n        if (released) return\n        released = true\n        player.removeListener(listener)\n        player.release()\n    }\n''', '''    fun release() {\n        if (released) return\n        val mediaUri = activeMediaUri ?: player.currentMediaItem?.localConfiguration?.uri\n        if (mediaUri != null) {\n            val duration = player.duration.coerceAtLeast(0L)\n            val position = player.currentPosition.coerceAtLeast(0L).coerceAtMost(duration)\n            eventFlow.tryEmit(Event.Released(mediaUri, position, duration))\n        }\n        released = true\n        activeMediaUri = null\n        player.removeListener(listener)\n        player.release()\n    }\n''')
          s = s.replace('''    private fun hasActiveMediaCallback(): Boolean =\n        !released && !switchingMedia && player.currentMediaItem != null\n''', '''    private fun hasActiveMediaCallback(): Boolean =\n        !released &&\n            !switchingMedia &&\n            player.currentMediaItem != null &&\n            player.currentMediaItem?.localConfiguration?.uri == activeMediaUri\n''')
          p.write_text(s)

          p = Path('app/src/main/java/com/innotrepid/videoplayer/VideoPlayerRootSafe.kt')
          s = p.read_text()
          s = s.replace('import androidx.lifecycle.viewmodel.compose.viewModel\n', 'import androidx.lifecycle.Lifecycle\nimport androidx.lifecycle.LifecycleEventObserver\nimport androidx.lifecycle.compose.LocalLifecycleOwner\nimport androidx.lifecycle.viewmodel.compose.viewModel\n')
          s = s.replace('    val context = LocalContext.current\n', '    val context = LocalContext.current\n    val lifecycleOwner = LocalLifecycleOwner.current\n', 1)
          s = s.replace('    val persist: (VideoItem) -> Unit = { video -> val duration = controller.durationMs(); if (duration > 0L) vm.updateProgress(video.id, controller.currentPositionMs(), duration) }\n', '    val persist: (VideoItem) -> Unit = { video -> val duration = controller.durationMs(); if (duration > 0L) vm.updateProgress(video.id, controller.currentPositionMs(), duration) }\n    val persistCheckpoint: () -> Unit = { latestSelected?.let(persist) }\n    val currentPersistCheckpoint by rememberUpdatedState(persistCheckpoint)\n')
          s = s.replace('    DisposableEffect(player) { onDispose { controller.release(); recorder.shutdown() } }\n', '''    DisposableEffect(lifecycleOwner, controller) {\n        val observer = LifecycleEventObserver { _, event ->\n            if (event == Lifecycle.Event.ON_PAUSE || event == Lifecycle.Event.ON_STOP) currentPersistCheckpoint()\n        }\n        lifecycleOwner.lifecycle.addObserver(observer)\n        onDispose { lifecycleOwner.lifecycle.removeObserver(observer) }\n    }\n    DisposableEffect(player) { onDispose { currentPersistCheckpoint(); controller.release(); recorder.shutdown() } }\n''')
          pattern = r'    LaunchedEffect\(controller\).*?    val scheme'
          replacement = '''    LaunchedEffect(controller) {\n        controller.events.collect { event ->\n            val video = latestSelected ?: return@collect\n            val released = event is PlaybackController.Event.Released\n            if (!released && controller.currentMediaUri() != video.uri) return@collect\n            if (released && event.mediaUri != video.uri) return@collect\n            val now = System.currentTimeMillis()\n            when (event) {\n                is PlaybackController.Event.Started -> recorder.emit(MomentumEvent.VideoStarted(video.id, event.positionMs, now))\n                is PlaybackController.Event.Resumed -> recorder.emit(MomentumEvent.VideoResumed(video.id, event.positionMs, now))\n                is PlaybackController.Event.Paused -> { recorder.emit(MomentumEvent.VideoPaused(video.id, event.positionMs, now)); persist(video) }\n                is PlaybackController.Event.Seeked -> { recorder.emit(MomentumEvent.VideoSeeked(video.id, event.fromPositionMs, event.toPositionMs, now)); persist(video) }\n                is PlaybackController.Event.Completed -> {\n                    recorder.emit(MomentumEvent.VideoCompleted(video.id, event.durationMs, now)); persist(video); vm.markCompleted(video.id)\n                    if (autoAdvance) { val next = PlaybackTransitionCoordinator.next(latestQueue, video.id); if (next != null) { queue = next; selectedId = next.current?.id } else selectedId = null } else selectedId = null\n                }\n                is PlaybackController.Event.Error -> { recorder.emit(MomentumEvent.VideoError(video.id, event.positionMs, event.message, now)); persist(video) }\n                is PlaybackController.Event.Released -> vm.updateProgress(video.id, event.positionMs, event.durationMs)\n            }\n        }\n    }\n    val scheme'''
          s2, n = re.subn(pattern, replacement, s, flags=re.S)
          if n != 1: raise SystemExit(f'collector replacement count={n}')
          p.write_text(s2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/innotrepid/videoplayer/playback/PlaybackController.kt app/src/main/java/com/innotrepid/videoplayer/VideoPlayerRootSafe.kt .github/workflows/phase123-edit.yml
          git rm .github/workflows/phase123-edit.yml
          git commit -m "Harden playback state and progress persistence"
          git push origin main