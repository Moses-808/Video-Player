name: Repair Visonate swipe wiring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Repair Visonate swipe gesture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair accumulated horizontal swipe detection
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/innotrepid/videoplayer/VideoPlayerRootSafe.kt')
          s = p.read_text()
          old = '''                        detectHorizontalDragGestures(\n                            onDragStart = { },\n                            onDragEnd = { },\n                            onDragCancel = { },\n                            onHorizontalDrag = { _, amount ->\n                                if (abs(amount) > 100f) {\n                                    val index = order.indexOf(screen)\n                                    val next = (index + if (amount < 0) 1 else -1).coerceIn(0, order.lastIndex)\n                                    if (next != index) navigateTo(order[next])\n                                }\n                            }\n                        )'''
          new = '''                        detectHorizontalDragGestures(\n                            onDragStart = {\n                                dragDistance = 0f\n                                swipeTriggered = false\n                            },\n                            onDragEnd = {\n                                dragDistance = 0f\n                                swipeTriggered = false\n                            },\n                            onDragCancel = {\n                                dragDistance = 0f\n                                swipeTriggered = false\n                            },\n                            onHorizontalDrag = { _, amount ->\n                                if (!swipeTriggered) {\n                                    dragDistance += amount\n                                    if (abs(dragDistance) >= 80f) {\n                                        val index = order.indexOf(screen)\n                                        val next = (index + if (dragDistance < 0f) 1 else -1).coerceIn(0, order.lastIndex)\n                                        if (next != index) navigateTo(order[next])\n                                        swipeTriggered = true\n                                    }\n                                }\n                            }\n                        )'''
          marker = '''                    .pointerInput(Unit) {\n                        detectHorizontalDragGestures('''
          replacement = '''                    .pointerInput(Unit) {\n                        var dragDistance = 0f\n                        var swipeTriggered = false\n                        detectHorizontalDragGestures('''
          if old not in s:
              raise SystemExit('expected swipe block not found')
          s = s.replace(marker, replacement, 1).replace(old, new, 1)
          p.write_text(s)
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/innotrepid/videoplayer/VideoPlayerRootSafe.kt
          git diff --cached --quiet && exit 0
          git commit -m "Repair Visonate swipe gesture"
          git push
      - name: Remove one-shot repair workflow
        if: success()
        run: |
          git rm .github/workflows/repair-swipe.yml
          git commit -m "Remove one-shot swipe repair workflow"
          git push
