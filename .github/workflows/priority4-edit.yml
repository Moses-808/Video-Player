name: Priority 4 edit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/priority4-edit.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply robust playback error handling
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('app/src/main/java/com/innotrepid/videoplayer')
          helper = root / 'PlaybackErrorPresentation.kt'
          helper.write_text('''package com.innotrepid.videoplayer\n\nimport androidx.media3.common.PlaybackException\n\ninternal enum class PlaybackErrorKind {\n    MISSING_MEDIA,\n    PERMISSION,\n    UNSUPPORTED_FORMAT,\n    DECODER,\n    SOURCE,\n    NETWORK,\n    UNKNOWN\n}\n\ninternal data class PlaybackErrorPresentation(\n    val kind: PlaybackErrorKind,\n    val title: String,\n    val explanation: String,\n    val actionLabel: String\n)\n\ninternal fun presentPlaybackError(errorCodeName: String, message: String?): PlaybackErrorPresentation {\n    val code = errorCodeName.uppercase()\n    val detail = message.orEmpty()\n    val lower = detail.lowercase()\n    return when {\n        code.contains("IO_FILE_NOT_FOUND") || code.contains("FILE_NOT_FOUND") || lower.contains("no such file") || lower.contains("file not found") ->\n            PlaybackErrorPresentation(PlaybackErrorKind.MISSING_MEDIA, "Video unavailable", "This video can no longer be opened. It may have been deleted or moved.", "Remove from library")\n        code.contains("PERMISSION") || code.contains("SECURITY") || lower.contains("permission") || lower.contains("access denied") ->\n            PlaybackErrorPresentation(PlaybackErrorKind.PERMISSION, "Permission needed", "Visonate no longer has access to this video. Re-import the file or grant access again.", "Back to library")\n        code.contains("DECODER") || code.contains("CODEC") || code.contains("RENDERER") || lower.contains("decoder") || lower.contains("codec") || lower.contains("unsupported") ->\n            PlaybackErrorPresentation(PlaybackErrorKind.UNSUPPORTED_FORMAT, "Format not supported", "This video uses a format or codec this device could not decode.", "Back to library")\n        code.contains("IO_NETWORK") || code.contains("NETWORK") || lower.contains("network") || lower.contains("http") ->\n            PlaybackErrorPresentation(PlaybackErrorKind.NETWORK, "Media source unavailable", "The video source could not be reached. Check the source and try again.", "Retry")\n        code.contains("SOURCE") || code.contains("IO_") ->\n            PlaybackErrorPresentation(PlaybackErrorKind.SOURCE, "Video could not be opened", "The media source could not be read. The file may be incomplete, corrupted, or unavailable.", "Retry")\n        else ->\n            PlaybackErrorPresentation(PlaybackErrorKind.UNKNOWN, "Playback stopped", "Visonate could not continue playback. Try again, or return to your library.", "Retry")\n    }\n}\n''')

          player = root / 'PhaseBPlayerScreen.kt'
          text = player.read_text()
          old = '''        state.errorMessage?.let { message ->\n            Surface(Modifier.align(Alignment.Center).padding(28.dp), shape = RoundedCornerShape(24.dp), color = Color.Black.copy(alpha = .90f)) {\n                Column(Modifier.padding(22.dp), horizontalAlignment = Alignment.CenterHorizontally) {\n                    Icon(Icons.Outlined.ErrorOutline, null, tint = MaterialTheme.colorScheme.error, modifier = Modifier.size(32.dp))\n                    Spacer(Modifier.height(10.dp))\n                    Text("Playback stopped", color = Color.White, style = MaterialTheme.typography.titleMedium)\n                    Spacer(Modifier.height(6.dp))\n                    Text(message, color = Color.White.copy(alpha = .72f), fontSize = 11.sp, maxLines = 3)\n                    Spacer(Modifier.height(14.dp))\n                    Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                        OutlinedButton(onClick = back) { Text("Back") }\n                        Button(onClick = { controller.retry(); chromeVisible = true }) { Text("Retry") }\n                    }\n                }\n            }\n        }'''
          new = '''        state.errorMessage?.let { message ->\n            val errorParts = remember(message) {\n                val pieces = message.split(":", limit = 2)\n                presentPlaybackError(pieces.firstOrNull().orEmpty(), pieces.getOrNull(1))\n            }\n            Surface(Modifier.align(Alignment.Center).padding(22.dp), shape = RoundedCornerShape(24.dp), color = Color.Black.copy(alpha = .93f)) {\n                Column(Modifier.padding(22.dp), horizontalAlignment = Alignment.CenterHorizontally) {\n                    Icon(Icons.Outlined.ErrorOutline, null, tint = MaterialTheme.colorScheme.error, modifier = Modifier.size(34.dp))\n                    Spacer(Modifier.height(10.dp))\n                    Text(errorParts.title, color = Color.White, style = MaterialTheme.typography.titleMedium)\n                    Spacer(Modifier.height(7.dp))\n                    Text(errorParts.explanation, color = Color.White.copy(alpha = .76f), fontSize = 11.sp, maxLines = 4)\n                    Spacer(Modifier.height(8.dp))\n                    Text("Technical: $message", color = Color.White.copy(alpha = .38f), fontSize = 9.sp, maxLines = 2)\n                    Spacer(Modifier.height(16.dp))\n                    Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                        OutlinedButton(onClick = back) { Text("Back to library") }\n                        if (errorParts.kind == PlaybackErrorKind.MISSING_MEDIA) {\n                            Button(onClick = back) { Text("Remove from library") }\n                        } else {\n                            Button(onClick = { controller.retry(); chromeVisible = true }) { Text("Retry") }\n                        }\n                    }\n                }\n            }\n        }'''
          if old not in text:
              raise SystemExit('Priority 4 error UI block not found')
          player.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/innotrepid/videoplayer/PlaybackErrorPresentation.kt app/src/main/java/com/innotrepid/videoplayer/PhaseBPlayerScreen.kt
          git commit -m "Improve playback error handling"
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/priority4-edit.yml
          git add .github/workflows/priority4-edit.yml
          git commit -m "Remove temporary Priority 4 edit workflow"
          git push
