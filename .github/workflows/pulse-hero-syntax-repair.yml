name: Pulse hero syntax repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed Pulse conditional
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/innotrepid/videoplayer/VisonatePulse.kt')
          text = p.read_text()
          old = 'Text(if (isDefaultHero) "Start with this.", else "I think this is next.", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.SemiBold)'
          new = 'Text(if (isDefaultHero) "Start with this." else "I think this is next.", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.SemiBold)'
          if old not in text:
              raise SystemExit('Expected malformed Pulse conditional not found')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/pulse-hero-syntax-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/innotrepid/videoplayer/VisonatePulse.kt .github/workflows/pulse-hero-syntax-repair.yml
          git diff --cached --check
          git commit -m 'Fix Pulse featured preview conditional'
          git push
